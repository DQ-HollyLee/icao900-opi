<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{width:412px;height:880px;border:0}#o{position:fixed;left:0;top:0;font:11px monospace;background:#ff0;z-index:9}</style></head>
<body><iframe id="f" src="index.html"></iframe><pre id="o"></pre>
<script>
var f=document.getElementById('f'),o=document.getElementById('o');
function L(s){o.textContent+=s+'\n'}
f.onload=function(){
  f.contentWindow.onerror=function(m,s,l){L('JSERR '+m+' @'+l)};
  var d;
  setTimeout(function(){
    d=f.contentDocument;
    d.querySelector('.ch-card').click();
    setTimeout(function(){
      d.querySelector('#btnRec').click();
      setTimeout(function(){
        d.querySelector('#btnRec').click();
        setTimeout(function(){
          L('recClass=' + d.querySelector('#btnRec').className);
          L('score=' + (d.querySelector('#scoreBox').className));
          L('scoreText=' + d.querySelector('#scoreBox').textContent.slice(0,60));
          document.title='DONE';
        }, 900);
      }, 800);
    }, 900);
  }, 900);
};
</script></body></html>
