<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font:12px monospace}iframe{width:412px;height:880px;border:0;position:absolute;left:-9999px}
pre{padding:8px;white-space:pre-wrap}
</style></head><body>
<iframe id="f" src="index.html"></iframe><pre id="o">…</pre>
<script>
var o = document.getElementById('o'), f = document.getElementById('f');
function log(s) { o.textContent += '\n' + s; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
f.onload = async function () {
  await wait(900);
  var d = f.contentDocument, W = f.contentWindow;
  d.querySelector('.ch-card').click();
  await wait(700);
  // 真实拖拽翻面（pointer 事件，和手指操作一致）
  var flip = d.querySelector('#flip');
  var fr0 = flip.getBoundingClientRect();
  var cy0 = fr0.top + fr0.height / 2;
  function pe(type, x) {
    flip.dispatchEvent(new W.PointerEvent(type, {
      bubbles: true, cancelable: true, clientX: x, clientY: cy0, pointerId: 1, pointerType: 'touch'
    }));
  }
  pe('pointerdown', fr0.left + fr0.width * 0.8);
  pe('pointermove', fr0.left + fr0.width * 0.6);
  pe('pointermove', fr0.left + fr0.width * 0.2);
  pe('pointerup', fr0.left + fr0.width * 0.2);
  await wait(600);
  log('flipped class: ' + flip.classList.contains('flipped'));
  var spans = d.querySelectorAll('#enText .w');
  log('word spans: ' + spans.length);
  var hit = {};
  for (var i = 0; i < Math.min(spans.length, 8); i++) {
    var r = spans[i].getBoundingClientRect();
    var el = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    var path = [];
    var e = el;
    while (e && e !== d.body && path.length < 4) {
      path.push(e.tagName.toLowerCase() + (e.id ? '#' + e.id : '') + (e.className ? '.' + String(e.className).split(' ')[0] : ''));
      e = e.parentElement;
    }
    hit[i] = path.join('<');
    log('w' + i + ' "' + spans[i].textContent + '" -> ' + path.join(' < '));
    if (el) el.dispatchEvent(new W.MouseEvent('click', { bubbles: true }));
  }
  // 也测一下中心点
  var fr = flip.getBoundingClientRect();
  var c = d.elementFromPoint(fr.left + fr.width / 2, fr.top + fr.height / 2);
  log('center -> ' + (c ? c.tagName + '.' + c.className + '#' + c.id : 'null'));
  await wait(250);
  log('highlighted: ' + d.querySelectorAll('#enText .w.hl').length + ' / ' +
      d.querySelectorAll('#enText .w').length);
  log('progress: ' + (localStorage.getItem('icao900.progress') || '{}').slice(0, 120));
  o.textContent += '\n== DONE ==';
};
</script>
</body></html>
