<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:11px monospace}#out{padding:8px;white-space:pre-wrap}</style></head>
<body><iframe id="f" src="index.html" style="width:412px;height:900px;border:1px solid #ccc"></iframe><pre id="out"></pre>
<script>
var out=document.getElementById('out'),f=document.getElementById('f');
function log(s){out.textContent+=s+'\n';}
f.onload=function(){
  var d=f.contentDocument;
  setTimeout(function(){
    log('tabbar tabs: '+d.querySelectorAll('.tabbar .tab').length);
    log('opi cards: '+d.querySelectorAll('[data-opi]').length);
    log('app head: '+d.getElementById('app').innerHTML.slice(0,120).replace(/\n/g,' '));
    var b=d.querySelector('[data-opi="toc"]');
    log('toc btn: '+!!b);
    if(b){ b.click(); }
    setTimeout(function(){
      log('after click, topic-cards: '+d.querySelectorAll('.topic-card').length);
      log('player: '+!!d.querySelector('.player'));
      log('app head: '+d.getElementById('app').innerHTML.slice(0,160).replace(/\n/g,' '));
      var t=d.querySelector('.topic-card');
      if(t) t.click();
      setTimeout(function(){
        log('after topic click, flip: '+!!d.querySelector('#flip')+' rec:'+!!d.querySelector('#btnRec')+' pass:'+!!d.querySelector('#btnPass'));
        ['.player','.deck-wrap','#flip','.face.front','.pager','.rec-zone','.mastery'].forEach(function(sel){
          var e=d.querySelector(sel);
          if(!e){log(sel+': MISSING');return;}
          var r=e.getBoundingClientRect(), cs=d.defaultView.getComputedStyle(e);
          log(sel+': '+Math.round(r.width)+'x'+Math.round(r.height)+' top='+Math.round(r.top)+' disp='+cs.display+' vis='+cs.visibility+' op='+cs.opacity+' z='+cs.zIndex+' pos='+cs.position);
        });
        log('body class: '+d.body.className);
        log('app html len: '+d.getElementById('app').innerHTML.length);
      },600);
    },400);
  },1200);
};
</script></body></html>
